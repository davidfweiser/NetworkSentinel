name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build app
        run: dotnet build NetworkSentinel.csproj -c Release

      - name: Run tests
        run: dotnet test Tests/NetworkSentinel.Tests -c Release
